name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: APK, unit tests and Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      # AGP resolves compileSdk's platform package and installs it when needed.
      # Do not assume its SDK Manager path is platforms;android-37.
      - name: Install Build Tools
        run: sdkmanager 'build-tools;36.0.0'

      - name: Set up Gradle and cache
        id: gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build Debug and unsigned Release APKs
        run: bash gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        if: ${{ !cancelled() && hashFiles('app/build/outputs/apk/debug/*.apk') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: atrium-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned Release APK
        if: ${{ !cancelled() && hashFiles('app/build/outputs/apk/release/*-unsigned.apk') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: atrium-release-unsigned-${{ github.sha }}
          path: app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run unit tests
        if: ${{ !cancelled() && steps.gradle.outcome == 'success' }}
        run: bash gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Run Android Lint
        if: ${{ !cancelled() && steps.gradle.outcome == 'success' }}
        run: bash gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Upload test and Lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: atrium-reports-${{ github.sha }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/testDebugUnitTest/**
            **/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14
