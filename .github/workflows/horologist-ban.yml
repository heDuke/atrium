name: Dependency ban (Horologist, phone M3, material-kolor, MCU)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ban:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for banned dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
          bash scripts/check-no-horologist.sh
